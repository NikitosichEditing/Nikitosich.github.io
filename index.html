<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
<title>Никита Андрианов — Режиссёр видеомонтажа</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #2e2c31;
    --bg-alt: #262429;
    --text: #ffffff;
    --text-dim: #a8a5ac;
    --accent: #ffffff;
    --border: rgba(255,255,255,0.08);
    --blue: #1e6fff;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.5;
  }
  body.modal-open { overflow: hidden; }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ===== НАВИГАЦИЯ ===== */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 0;
    position: relative;
    z-index: 10;
  }
  .nav__logo { font-weight: 800; font-size: 20px; letter-spacing: 0.5px; }
  .nav__list { display: flex; gap: 32px; list-style: none; }
  .nav__link { font-size: 15px; color: var(--text-dim); transition: color 0.2s; }
  .nav__link:hover { color: var(--accent); }

  /* ===== СВЕЧЕНИЯ ===== */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  .glow-blue  { background: radial-gradient(circle, rgba(30,111,255,0.55) 0%, transparent 70%); }
  .glow-red   { background: radial-gradient(circle, rgba(255,46,77,0.5) 0%, transparent 70%); }
  .glow-white { background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%); }

  @keyframes float1 { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(60px,-40px) scale(1.1);} }
  @keyframes float2 { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(-50px,40px) scale(1.12);} }
  @keyframes float3 { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(40px,-30px) scale(0.92);} }

  /* ===== ЗВЕЗДОПАД ===== */
  .starfall {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .starfall__star {
    position: absolute;
    top: -20px;
    width: 3px;
    height: 3px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow:
      0 0 6px 2px rgba(255,255,255,0.9),
      0 0 12px 4px rgba(30,111,255,0.4);
    opacity: 0;
    animation: starFall linear infinite;
  }

  .starfall__star::before {
    content: "";
    position: absolute;
    top: 50%;
    right: 0;
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.9) 100%);
    transform: translateY(-50%) translateX(100%);
    transform-origin: left center;
    border-radius: 50%;
    filter: blur(0.5px);
  }

  .starfall__star--blue {
    background: #7eb8ff;
    box-shadow:
      0 0 6px 2px rgba(126,184,255,0.9),
      0 0 14px 5px rgba(30,111,255,0.5);
  }
  .starfall__star--blue::before {
    background: linear-gradient(90deg, transparent 0%, rgba(126,184,255,0.9) 100%);
  }

  .starfall__star--red {
    background: #ff8a9c;
    box-shadow:
      0 0 6px 2px rgba(255,138,156,0.9),
      0 0 14px 5px rgba(255,46,77,0.5);
  }
  .starfall__star--red::before {
    background: linear-gradient(90deg, transparent 0%, rgba(255,138,156,0.9) 100%);
  }

  @keyframes starFall {
    0% {
      transform: translate(0, 0) rotate(-35deg);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    85% {
      opacity: 1;
    }
    100% {
      transform: translate(-400px, 110vh) rotate(-35deg);
      opacity: 0;
    }
  }

  /* ===== ДЕКОР ===== */
  .section-decor {
    position: absolute;
    pointer-events: none;
    user-select: none;
    z-index: 0;
    opacity: 0.08;
  }
  .section-decor--tl { top: 30px; left: 30px; }
  .section-decor--tr { top: 30px; right: 30px; }
  .section-decor--bl { bottom: 30px; left: 30px; }
  .section-decor--br { bottom: 30px; right: 30px; }
  .section-decor--icon { width: 200px; opacity: 0.07; }
  .section-decor--icon-lg { width: 320px; opacity: 0.06; }
  .section-decor--star {
    width: 40px;
    height: 40px;
    background: var(--accent);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity: 0.15;
    animation: starRotate 12s linear infinite;
  }
  @keyframes starRotate {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* ===== ШАПКА ===== */
  .header {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  .header__bg {
    position: absolute;
    inset: 0;
    background: url("img/images/header-background.png") center/cover no-repeat;
    opacity: 0.85;
    z-index: 0;
  }
  .header__overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      rgba(46,44,49,0.85) 0%,
      rgba(46,44,49,0.5) 50%,
      rgba(46,44,49,0.15) 100%);
    z-index: 1;
  }
  .header .container {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .header__content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    padding: 60px 0;
  }
  .header__title {
    font-size: clamp(32px, 5vw, 64px);
    font-weight: 800;
    line-height: 1.05;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .header__title_accent {
    display: block;
    color: var(--accent);
    font-size: 0.45em;
    font-weight: 600;
    text-transform: none;
    margin-bottom: 8px;
  }
  .header__subtitle {
    font-size: clamp(18px, 2vw, 26px);
    color: var(--text-dim);
    margin-bottom: 36px;
  }
  .header__subtitle .header__title_accent {
    display: inline;
    font-size: 1em;
    margin-right: 6px;
    margin-bottom: 0;
  }

  .header__btns {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .header__btn {
    position: relative;
    display: inline-block;
    padding: 16px 40px;
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 10px;
    font-weight: 700;
    font-size: 16px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    white-space: nowrap;

    animation: btnPulse 2.5s ease-in-out infinite;
    transition: background 0.3s, color 0.3s;
  }

  @keyframes btnPulse {
    0%, 100% {
      box-shadow:
        0 0 0 0 rgba(255,255,255,0.5),
        0 0 20px rgba(255,255,255,0.3),
        inset 0 0 0 rgba(255,255,255,0);
      transform: scale(1);
    }
    50% {
      box-shadow:
        0 0 0 12px rgba(255,255,255,0),
        0 0 35px rgba(255,255,255,0.6),
        inset 0 0 15px rgba(255,255,255,0.15);
      transform: scale(1.03);
    }
  }

  .header__btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      120deg,
      transparent 0%,
      transparent 40%,
      rgba(255,255,255,0.4) 50%,
      transparent 60%,
      transparent 100%
    );
    animation: btnShine 3s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes btnShine {
    0% { left: -150%; }
    50% { left: 150%; }
    100% { left: 150%; }
  }

  .header__btn::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.6);
    opacity: 0;
    animation: btnRing 2.5s ease-out infinite;
    pointer-events: none;
  }

  @keyframes btnRing {
    0% { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.25); }
  }

  .header__btn:hover {
    background: var(--accent);
    color: var(--bg);
    animation-play-state: paused;
    box-shadow: 0 0 50px rgba(255,255,255,0.8);
  }
  .header__btn:hover::before { animation: none; opacity: 0; }
  .header__btn:hover::after  { animation: none; opacity: 0; }

  .header__btn-channel {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 40px;
    background: linear-gradient(135deg, var(--blue) 0%, #0d4fc4 100%);
    color: #ffffff;
    font-weight: 700;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: 0.3s;
    box-shadow: 0 8px 24px rgba(30,111,255,0.4);
    overflow: hidden;
  }

  .header__btn-channel::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transition: 0.6s;
  }

  .header__btn-channel:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 36px rgba(30,111,255,0.7);
  }
  .header__btn-channel:hover::before { left: 100%; }

  .header__btn-channel svg {
    width: 20px;
    height: 20px;
    fill: #fff;
    flex-shrink: 0;
  }

  /* ===== СЕКЦИИ ===== */
  main section {
    padding: 120px 0;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }

  .section-title {
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 48px;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .section-title .accent { color: var(--accent); }
  .section-title::before {
    content: "";
    display: inline-block;
    width: 28px;
    height: 28px;
    background: var(--accent);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    flex-shrink: 0;
    animation: starRotate 6s linear infinite;
  }
  .section-title::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -20px;
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
    border-radius: 2px;
  }

  /* ===== ОБО МНЕ ===== */
  .about .glow-blue  { width: 500px; height: 500px; top: -100px; left: -150px; animation: float1 15s ease-in-out infinite alternate; }
  .about .glow-white { width: 400px; height: 400px; bottom: -100px; right: -100px; animation: float3 18s ease-in-out infinite alternate; }

  .about__bg-icon {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    user-select: none;
    opacity: 0.1;
  }
  .about__bg-icon--pr { width: 380px; top: 40px; left: -80px; transform: rotate(-15deg); }
  .about__bg-icon--ae { width: 420px; bottom: -60px; right: -100px; transform: rotate(12deg); }
  .about__bg-icon--ps { width: 320px; top: 50%; left: 35%; transform: translate(-50%, -50%) rotate(-8deg); opacity: 0.06; }
  .about__bg-icon--me { width: 260px; top: 60px; right: -60px; transform: rotate(18deg); opacity: 0.08; }

  .about__grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 48px;
    align-items: start;
    position: relative;
    z-index: 2;
  }

  .about__left {
    display: flex;
    flex-direction: column;
    gap: 24px;
    align-items: flex-start;
  }
  .about__photo-wrap {
    position: relative;
    width: 100%;
  }
  .about__photo-wrap::before,
  .about__photo-wrap::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid var(--accent);
    opacity: 0.5;
  }
  .about__photo-wrap::before {
    top: -10px;
    left: -10px;
    border-right: none;
    border-bottom: none;
    border-top-left-radius: 8px;
  }
  .about__photo-wrap::after {
    bottom: -10px;
    right: -10px;
    border-left: none;
    border-top: none;
    border-bottom-right-radius: 8px;
  }
  .about__photo {
    border-radius: 16px;
    border: 1px solid var(--border);
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    object-position: center top;
  }

  .about__right {
    display: flex;
    flex-direction: column;
  }

  .about__text {
    font-size: 18px;
    line-height: 1.7;
    color: #d8d5dc;
    margin-bottom: 16px;
  }
  .about__text .accent { color: var(--accent); font-weight: 700; }

  .about__list {
    list-style: none;
    padding: 0;
    margin: 0 0 16px 0;
    position: relative;
    z-index: 2;
  }
  .about__list li {
    font-size: 17px;
    line-height: 1.8;
    color: #d8d5dc;
    padding-left: 4px;
  }

  .about__skills-block {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .about__skills-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 40px;
    background: linear-gradient(135deg, var(--blue) 0%, #0d4fc4 100%);
    color: #ffffff;
    font-weight: 700;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 8px 24px rgba(30,111,255,0.4);
    text-decoration: none;
    position: relative;
    overflow: hidden;
    white-space: nowrap;
  }
  .about__skills-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: 0.6s;
  }
  .about__skills-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(30,111,255,0.6);
  }
  .about__skills-btn:hover::before { left: 100%; }

  .about__skills {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .about__skills img {
    width: 44px; height: 44px;
    object-fit: contain;
    filter: grayscale(1) brightness(2);
    opacity: 0.75;
    transition: 0.25s;
  }
  .about__skills img:hover { opacity: 1; filter: none; }

  /* ===== ЛЮБИМАЯ РАБОТА ===== */
  .favorite .glow-blue  { width: 550px; height: 550px; top: -150px; left: -150px; animation: float1 16s ease-in-out infinite alternate; }
  .favorite .glow-red   { width: 500px; height: 500px; bottom: -150px; right: -100px; animation: float2 19s ease-in-out infinite alternate; }

  .favorite__link {
    display: block;
    position: relative;
    z-index: 2;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 60px rgba(30,111,255,0.08);
    max-width: 1000px;
    margin: 0 auto;
    transition: 0.4s ease;
    cursor: pointer;
  }

  .favorite__link:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 80px rgba(30,111,255,0.3);
    border-color: var(--accent);
  }

  .favorite__img {
    width: 100%;
    height: auto;
    display: block;
    transition: 0.5s ease;
  }

  .favorite__link:hover .favorite__img {
    transform: scale(1.05);
  }

  .favorite__link::before,
  .favorite__link::after {
    content: "";
    position: absolute;
    width: 48px;
    height: 48px;
    border: 2px solid var(--accent);
    opacity: 0.5;
    pointer-events: none;
    z-index: 3;
  }
  .favorite__link::before {
    top: 16px; left: 16px;
    border-right: none; border-bottom: none;
    border-top-left-radius: 14px;
  }
  .favorite__link::after {
    bottom: 16px; right: 16px;
    border-left: none; border-top: none;
    border-bottom-right-radius: 14px;
  }

  .favorite__overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(46,44,49,0) 40%, rgba(10,10,12,0.9) 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 32px;
    opacity: 0;
    transition: 0.4s ease;
    z-index: 2;
    pointer-events: none;
  }

  .favorite__link:hover .favorite__overlay {
    opacity: 1;
  }

  .favorite__play {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 16px 36px;
    background: #ff0000;
    color: #ffffff;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.5px;
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(255,0,0,0.5);
    transform: translateY(20px);
    transition: 0.4s ease;
  }

  .favorite__link:hover .favorite__play {
    transform: translateY(0);
  }

  .favorite__play svg {
    width: 22px;
    height: 22px;
    fill: #fff;
  }

  .favorite__play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(255, 0, 0, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    box-shadow: 0 10px 40px rgba(255, 0, 0, 0.6);
    transition: 0.4s ease;
    pointer-events: none;
    animation: playPulse 2.5s ease-in-out infinite;
  }

  .favorite__play-icon svg {
    width: 40px;
    height: 40px;
    fill: #fff;
    margin-left: 4px;
  }

  @keyframes playPulse {
    0%, 100% {
      box-shadow: 0 10px 40px rgba(255, 0, 0, 0.6), 0 0 0 0 rgba(255, 0, 0, 0.7);
      transform: translate(-50%, -50%) scale(1);
    }
    50% {
      box-shadow: 0 10px 40px rgba(255, 0, 0, 0.6), 0 0 0 20px rgba(255, 0, 0, 0);
      transform: translate(-50%, -50%) scale(1.08);
    }
  }

  .favorite__link:hover .favorite__play-icon {
    background: #ff0000;
    transform: translate(-50%, -50%) scale(1.15);
  }

  /* ===== ПАК ДЛЯ МОНТАЖА ===== */
  .pack .glow-blue  { width: 550px; height: 550px; top: -150px; right: -150px; animation: float2 17s ease-in-out infinite alternate; }
  .pack .glow-white { width: 450px; height: 450px; bottom: -150px; left: -100px; animation: float3 20s ease-in-out infinite alternate; }

  .pack__box {
    position: relative;
    z-index: 2;
    background: linear-gradient(160deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px;
    padding: 60px 56px;
    backdrop-filter: blur(10px);
    max-width: 900px;
    margin: 0 auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 60px rgba(30,111,255,0.08);
    overflow: hidden;
  }

  .pack__box::before,
  .pack__box::after {
    content: "";
    position: absolute;
    width: 48px;
    height: 48px;
    border: 2px solid var(--accent);
    opacity: 0.4;
    pointer-events: none;
  }
  .pack__box::before {
    top: 16px; left: 16px;
    border-right: none; border-bottom: none;
    border-top-left-radius: 14px;
  }
  .pack__box::after {
    bottom: 16px; right: 16px;
    border-left: none; border-top: none;
    border-bottom-right-radius: 14px;
  }

  .pack__title {
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 800;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .pack__title .accent { color: var(--accent); }

  .pack__text {
    font-size: 17px;
    line-height: 1.7;
    color: #d8d5dc;
    margin-bottom: 16px;
    max-width: 720px;
  }
  .pack__text .accent { color: var(--accent); font-weight: 700; }

  .pack__price {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    padding: 12px 24px;
    border: 2px solid var(--accent);
    border-radius: 50px;
    margin: 20px 0 32px;
    background: rgba(255,255,255,0.04);
    animation: pricePulse 2s ease-in-out infinite;
  }

  @keyframes pricePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.3), 0 0 15px rgba(255,255,255,0.15); }
    50% { box-shadow: 0 0 0 8px rgba(255,255,255,0), 0 0 25px rgba(255,255,255,0.35); }
